[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wizzlab"
version = "0.1.0"
description = "Ferramentas de validacao de estrategias sistematicas, no padrao visual Wizz"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gustavo Thiesen" }]
keywords = ["backtest", "validacao", "quantitativo", "financas", "overfitting"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
exact = ["scipy>=1.10"]   # p-valor exato do Ljung-Box; ha fallback sem ele

[project.urls]
Homepage = "https://github.com/Gustavofthiesen/wizz-lab"

[tool.setuptools.packages.find]
include = ["wizzlab*"]
